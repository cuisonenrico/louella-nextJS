name: CI

# Vercel deploys every push to master, so this is the only thing standing
# between a broken change and the bakery's sheets. It needs no secrets: the
# server suites use mocks and an in-memory stock database, and the build never
# connects to Postgres (Nest boots on the first request, not at build time).

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so config validation and the build have something to
      # read. Nothing here is a real credential or reaches a real database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck (app)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (server)
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Test (web)
        run: npm run test:web

      - name: Test (server)
        run: npm run test:server

      - name: Build
        run: npm run build

  # Browser smoke tests against a throwaway Postgres. Everything comes from
  # .env.e2e (fake secrets, local database) — this job needs no secrets. The
  # suite refuses to run against anything but localhost/louella_e2e.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: louella
          POSTGRES_PASSWORD: louella
          POSTGRES_DB: louella_e2e
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U louella -d louella_e2e"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Playwright builds the app and starts it on :4100, then resets, migrates
      # and seeds the database (see playwright.config.ts, e2e/global-setup.ts).
      - name: E2E smoke
        run: npm run e2e:smoke

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-results/
          retention-days: 7
